name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'remote-config.json'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' "$MANIFEST"
          echo "---- AndroidManifest.xml ----"
          cat "$MANIFEST"

      - name: Apply app logo and splash
        run: |
          cp -r resources/android-res/* android/app/src/main/res/
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item>\n        <item name="windowSplashScreenBackground">@color/ic_launcher_background</item>#' "$STYLES"
          cat "$STYLES"

      - name: Use fixed signing key (so new builds update the old app)
        run: |
          mkdir -p ~/.android
          cp resources/debug.keystore ~/.android/debug.keystore

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ghostwave.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghostwave-APK
          path: Ghostwave.apk
